name: rfid_live
description: "RFID LIVE - Rastreamento inteligente de ferramentas industriais por etiquetas RFID."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Gerenciamento de estado (ChangeNotifier + Provider)
  provider: ^6.1.5+1
  # Formatacao de datas/numeros em pt_BR
  # Versao alinhada com a que o flutter_localizations fixa no SDK
  intl: ^0.20.2
  # Persistencia local da sessao e preferencias
  shared_preferences: ^2.5.5
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
